  services:

    db:
      image: postgres:16-alpine
      container_name: foundite-db
      environment:
        POSTGRES_DB: founditedb
        POSTGRES_USER: foundite
        POSTGRES_PASSWORD: foundite123
      ports:
        - "5432:5432"
      volumes:
        - db_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U foundite -d founditedb"]
        interval: 10s
        timeout: 5s
        retries: 5

    app:
      build: .
      container_name: foundite-app
      depends_on:
        db:
          condition: service_healthy
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/founditedb
        SPRING_DATASOURCE_USERNAME: foundite
        SPRING_DATASOURCE_PASSWORD: foundite123
        SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
        SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
        SPRING_JPA_HIBERNATE_DDL_AUTO: update
      ports:
        - "8080:8080"

  volumes:
    db_data: