<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FoundIt - Item Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top py-3 mb-5">
        <div class="container">
            <a class="navbar-brand fs-4" href="/"><i class="bi bi-box-seam me-2"></i>FoundIt</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <a href="/items" class="text-decoration-none fw-semibold mb-4 d-inline-block">
                    <i class="bi bi-arrow-left me-2"></i>Back to Gallery
                </a>
                
                <div class="card p-5">
                    <div class="text-center mb-5">
                        <span class="badge badge-custom fs-6 px-4 py-2 mb-3" th:text="${item.category}">Category</span>
                        <h1 class="display-4 fw-bold" th:text="${item.title}">Item Name</h1>
                    </div>
                    
                    <div class="bg-light rounded-4 p-4">
                        <div class="row g-4">
                            <div class="col-sm-6">
                                <div class="d-flex align-items-center">
                                    <div class="bg-white p-3 rounded-circle shadow-sm me-3">
                                        <i class="bi bi-geo-alt text-danger fs-4"></i>
                                    </div>
                                    <div>
                                        <p class="text-muted mb-0 small text-uppercase fw-bold">Location</p>
                                        <p class="fs-5 fw-semibold mb-0" th:text="${item.location}">Location Name</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="d-flex align-items-center">
                                    <div class="bg-white p-3 rounded-circle shadow-sm me-3">
                                        <i class="bi bi-calendar-event text-primary fs-4"></i>
                                    </div>
                                    <div>
                                        <p class="text-muted mb-0 small text-uppercase fw-bold">Reported On</p>
                                        <p class="fs-5 fw-semibold mb-0">Recently</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
