<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foundite – Profile</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link th:href="@{/css/index.css}" rel="stylesheet" />
    <link th:href="@{/css/profile.css}" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-md navbar-foundite px-4">
      <a class="navbar-brand" th:href="@{/}">FOUNDITE</a>
      <button
        class="navbar-toggler ms-auto"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navMenu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navMenu">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/items}">Find</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/items/new}">Add</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" th:href="@{/profile}">Profile</a>
          </li>
        </ul>
      </div>
    </nav>

    <section class="profile-banner">
      <div class="profile-banner-overlay"></div>
      <div class="container position-relative">
        <div class="profile-header">
          <div class="profile-avatar">
            <span
              th:text="${username != null ? #strings.toUpperCase(#strings.left(username, 1)) : '?'}"
              >U</span
            >
          </div>
          <div class="profile-meta">
            <h1 class="profile-username" th:text="${username}">username</h1>
            <span class="profile-badge">Member</span>
          </div>
        </div>
      </div>
    </section>

    <main class="container profile-main">
      <div class="row profile-stats-row g-3 mb-5">
        <div class="col-4">
          <div class="stat-card">
            <span
              class="stat-number"
              th:text="${itemCount != null ? itemCount : 0}"
              >0</span
            >
            <span class="stat-label">Items Posted</span>
          </div>
        </div>
        <div class="col-4">
          <div class="stat-card">
            <span
              class="stat-number"
              th:text="${resolvedCount != null ? resolvedCount : 0}"
              >0</span
            >
            <span class="stat-label">Resolved</span>
          </div>
        </div>
        <div class="col-4">
          <div class="stat-card">
            <span
              class="stat-number"
              th:text="${createdAt != null ? createdAt.year : '—'}"
              >—</span
            >
            <span class="stat-label">Joined</span>
          </div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-md-4">
          <div class="profile-card">
            <h2 class="profile-section-title">Account</h2>
            <ul class="profile-info-list">
              <li>
                <span class="info-label">Username</span>
                <span class="info-value" th:text="${username}">—</span>
              </li>
              <li>
                <span class="info-label">Full Name</span>
                <span
                  class="info-value"
                  th:text="${fullName != null ? fullName : '—'}"
                  >—</span
                >
              </li>
              <li>
                <span class="info-label">Email</span>
                <span
                  class="info-value"
                  th:text="${email != null ? email : '—'}"
                  >—</span
                >
              </li>
              <li>
                <span class="info-label">Role</span>
                <span
                  class="info-value"
                  th:text="${role != null ? role : 'User'}"
                  >User</span
                >
              </li>
            </ul>
            <div class="mt-4 d-flex flex-column gap-2">
              <a
                th:href="@{/logout}"
                class="btn btn-outline-danger btn-sm w-100"
                >Log Out</a
              >
            </div>
          </div>
        </div>

        <div class="col-md-8">
          <div class="profile-card">
            <h2 class="profile-section-title">My Listings</h2>

            <div
              th:if="${userItems == null or #lists.isEmpty(userItems)}"
              class="empty-state"
            >
              <p class="empty-text">You haven't posted anything yet.</p>
              <a th:href="@{/items/new}" class="btn btn-light btn-sm px-4"
                >POST AN ITEM</a
              >
            </div>

            <div
              th:if="${userItems != null and not #lists.isEmpty(userItems)}"
              class="item-list"
            >
              <div th:each="item : ${userItems}" class="item-row">
                <div class="item-row-info">
                  <span class="item-row-title" th:text="${item.title}"
                    >Item title</span
                  >
                  <span class="item-row-category" th:text="${item.category}"
                    >Category</span
                  >
                </div>
                <div class="item-row-actions">
                  <a
                    th:href="@{/items/{id}(id=${item.id})}"
                    class="btn-icon"
                    title="View"
                    >👁</a
                  >
                  <a
                    th:href="@{/items/{id}/edit(id=${item.id})}"
                    class="btn-icon"
                    title="Edit"
                    >✏️</a
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="py-4 text-center mt-5">
      <p class="mb-0">&copy; 2025 Foundite</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
