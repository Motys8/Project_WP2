<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${item.title} + ' — Foundite'">Item — Foundite</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link th:href="@{/css/index.css}" rel="stylesheet" />
    <link th:href="@{/css/items.css}" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-md navbar-foundite px-4">
      <a class="navbar-brand" th:href="@{/}">FOUNDITE</a>
      <button
        class="navbar-toggler ms-auto"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navMenu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navMenu">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
          <li class="nav-item">
            <a class="nav-link active" th:href="@{/items}">Find</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/items/new}">Add</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/profile}">Profile</a>
          </li>
        </ul>
      </div>
    </nav>

    <div class="items-header">
      <div class="container">
        <a th:href="@{/items}" class="detail-back">← Back to listings</a>
        <h1 class="items-title" th:text="${item.title}">Item Title</h1>
      </div>
    </div>

    <main class="container detail-main">
      <div class="row g-4">
        <div class="col-md-5">
          <div class="detail-img-wrap">
            <img
              th:if="${item.imagePath != null and !item.imagePath.isEmpty()}"
              th:src="${item.imagePath}"
              alt="Item image"
              class="detail-img"
            />
            <div
              th:if="${item.imagePath == null or item.imagePath.isEmpty()}"
              class="detail-img-placeholder"
            >
              <span>No Image</span>
            </div>
          </div>
        </div>

        <div class="col-md-7">
          <div class="detail-card">
            <span
              class="item-status-badge detail-badge"
              th:classappend="${item.status != null and item.status.name() == 'LOST'} ? 'badge-lost' : 'badge-found'"
              th:text="${item.status != null ? item.status.name() : 'FOUND'}"
              >FOUND</span
            >

            <h2 class="detail-title" th:text="${item.title}">Title</h2>

            <ul class="detail-meta">
              <li>
                <span class="detail-meta-label">Category</span>
                <span
                  class="detail-meta-value"
                  th:text="${item.category != null ? item.category : '—'}"
                  >—</span
                >
              </li>
              <li>
                <span class="detail-meta-label">Location</span>
                <span
                  class="detail-meta-value"
                  th:text="${item.location != null ? item.location : '—'}"
                  >—</span
                >
              </li>
              <li>
                <span class="detail-meta-label">Date</span>
                <span
                  class="detail-meta-value"
                  th:text="${item.foundDate != null ? item.foundDate : '—'}"
                  >—</span
                >
              </li>
              <li>
                <span class="detail-meta-label">Posted by</span>
                <span
                  class="detail-meta-value"
                  th:text="${item.postedBy != null ? item.postedBy.username : 'Anonymous'}"
                  >—</span
                >
              </li>
              <li>
                <span class="detail-meta-label">Posted on</span>
                <span
                  class="detail-meta-value"
                  th:text="${item.createdAt != null ? item.createdAt.toLocalDate() : '—'}"
                  >—</span
                >
              </li>
              <li
                th:if="${item.phoneNumber != null and !item.phoneNumber.isEmpty()}"
              >
                <span class="detail-meta-label">Contact</span>
                <a
                  th:href="'tel:' + ${item.phoneNumber}"
                  class="detail-phone"
                  th:text="${item.phoneNumber}"
                  >—</a
                >
              </li>
            </ul>

            <div
              th:if="${item.description != null and !item.description.isEmpty()}"
              class="detail-description"
            >
              <span class="detail-meta-label">Description</span>
              <p th:text="${item.description}">Description</p>
            </div>

            <div class="detail-actions" th:if="${canEdit}">
              <a
                th:href="@{/items/{id}/edit(id=${item.id})}"
                class="btn-foundite"
                >EDIT</a
              >
              <form
                th:action="@{/items/{id}/delete(id=${item.id})}"
                method="post"
                style="display: inline"
              >
                <button
                  type="submit"
                  class="btn-delete"
                  onclick="
                    return confirm(
                      'Are you sure you want to delete this item?',
                    );
                  "
                >
                  DELETE
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="py-4 text-center mt-5">
      <p class="mb-0">&copy; 2026 Foundite</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
