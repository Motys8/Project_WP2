<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title
      th:text="${item.id != null} ? 'Foundite – Edit Item' : 'Foundite – Post an Item'"
    >
      Foundite – Post an Item
    </title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link th:href="@{/css/index.css}" rel="stylesheet" />
    <link th:href="@{/css/items.css}" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-md navbar-foundite px-4">
      <a class="navbar-brand" th:href="@{/}">FOUNDITE</a>
      <button
        class="navbar-toggler ms-auto"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navMenu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navMenu">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/items}">Find</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" th:href="@{/items/new}">Add</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/profile}">Profile</a>
          </li>
        </ul>
      </div>
    </nav>

    <div class="items-header">
      <div class="container">
        <h1
          class="items-title"
          th:text="${item.id != null} ? 'EDIT ITEM' : 'POST AN ITEM'"
        >
          POST AN ITEM
        </h1>
        <p
          class="items-subtitle"
          th:text="${item.id != null} ? 'Update the details of your listing' : 'Report something you found or lost'"
        >
          Report something you found or lost
        </p>
      </div>
    </div>

    <main class="container form-main">
      <div class="form-card">
        <form
          th:action="${item.id != null} ? @{/items/{id}(id=${item.id})} : @{/items}"
          th:object="${item}"
          method="post"
          enctype="multipart/form-data"
        >
          <div class="form-row-2">
            <div class="form-group">
              <label class="form-label-custom"
                >Title <span class="required">*</span></label
              >
              <input
                type="text"
                class="form-control-custom"
                th:field="*{title}"
                placeholder="e.g. Black iPhone 14"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label-custom"
                >Category <span class="required">*</span></label
              >
              <select
                class="form-control-custom"
                th:field="*{category}"
                required
              >
                <option value="">Select a category</option>
                <option value="Electronics">Electronics</option>
                <option value="Clothing">Clothing</option>
                <option value="Bags">Bags</option>
                <option value="Jewelry">Jewelry</option>
                <option value="Keys">Keys</option>
                <option value="Documents">Documents</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="form-row-2">
            <div class="form-group">
              <label class="form-label-custom"
                >Status <span class="required">*</span></label
              >
              <div class="status-toggle">
                <label class="status-option">
                  <input
                    type="radio"
                    th:field="*{status}"
                    value="FOUND"
                    required
                  />
                  <span class="status-btn status-found">I FOUND IT</span>
                </label>
                <label class="status-option">
                  <input
                    type="radio"
                    th:field="*{status}"
                    value="LOST"
                    required
                  />
                  <span class="status-btn status-lost">I LOST IT</span>
                </label>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label-custom">Date Found / Lost</label>
              <input
                type="date"
                class="form-control-custom"
                th:field="*{foundDate}"
              />
            </div>
          </div>

          <div class="form-row-2">
            <div class="form-group">
              <label class="form-label-custom">Location</label>
              <input
                type="text"
                class="form-control-custom"
                th:field="*{location}"
                placeholder="e.g. Gare du Nord, Paris"
              />
            </div>
            <div class="form-group">
              <label class="form-label-custom"
                >Phone Number <span class="required">*</span></label
              >
              <input
                type="tel"
                class="form-control-custom"
                th:field="*{phoneNumber}"
                placeholder="e.g. +33 6 12 34 56 78"
                required
              />
              <div
                class="invalid-feedback d-block"
                th:if="${#fields.hasErrors('phoneNumber')}"
                th:errors="*{phoneNumber}"
              ></div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label-custom">Description</label>
            <textarea
              class="form-control-custom"
              th:field="*{description}"
              rows="4"
              placeholder="Describe the item in detail: color, brand, distinctive marks..."
            ></textarea>
          </div>

          <div class="form-group">
            <label class="form-label-custom">Item Picture</label>
            <input
              type="file"
              name="imageFile"
              class="form-control-custom"
              accept="image/*"
            />

            <div th:if="${item.imagePath != null}" class="mt-3">
              <p class="form-hint">Current Image:</p>
              <img
                th:src="${item.imagePath}"
                alt="Item picture"
                style="max-height: 150px; border-radius: 8px"
              />
            </div>
          </div>

          <div class="form-actions">
            <a th:href="@{/items}" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-foundite">
              <span th:text="${item.id != null} ? 'SAVE CHANGES' : 'POST ITEM'"
                >POST ITEM</span
              >
            </button>
          </div>
        </form>
      </div>
    </main>

    <footer class="py-4 text-center mt-5">
      <p class="mb-0">&copy; 2026 Foundite</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
