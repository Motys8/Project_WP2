<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FoundIt - All Items</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top py-3 mb-4">
        <div class="container">
            <a class="navbar-brand fs-4 fw-bold text-primary" href="/">
                <i class="bi bi-box-seam me-2"></i>FoundIt
            </a>
            <a href="/" class="btn btn-outline-dark rounded-pill btn-centered">Back to Home</a>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row align-items-center mb-5">
            <div class="col-md-6">
                <h1 class="fw-bold display-6 mb-0">All Items</h1>
                <p class="text-muted mt-2">Browse through all reported lost and found items.</p>
            </div>
            <div class="col-md-6">
                <form action="/items" method="get" class="d-flex gap-2 justify-content-md-end">
                    <select name="category" class="form-select custom-select w-auto border-0 shadow-sm rounded-pill py-2 pl-3">
                        <option value="">All Categories</option>
                        <option value="Bags">Bags</option>
                        <option value="Keys">Keys</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Accessories">Accessories</option>
                    </select>
                    <button type="submit" class="btn btn-primary rounded-pill btn-centered shadow-sm">Filter</button>
                </form>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(items)}" class="empty-state text-center shadow-sm">
            <i class="bi bi-search display-1 text-muted mb-3 d-block opacity-50"></i>
            <h3 class="fw-bold">No results found</h3>
            <p class="text-muted">Try adjusting your category filter.</p>
        </div>

        <div class="row g-4" th:unless="${#lists.isEmpty(items)}">
            <div class="col-md-3" th:each="item : ${items}">
                <div class="card h-100 text-center p-3">
                    <div class="card-body">
                        <span class="badge bg-primary bg-opacity-10 text-primary rounded-pill px-3 py-2 mb-3 fw-semibold" th:text="${item.category}">Category</span>
                        <h5 class="fw-bold mb-2" th:text="${item.title}">Item Title</h5>
                        <p class="text-muted small mb-0">
                            <i class="bi bi-geo-alt-fill text-danger"></i> <span th:text="${item.location}">Location</span>
                        </p>
                    </div>
                    <div class="card-footer bg-transparent border-0">
                        <a th:href="@{/items/{id}(id=${item.id})}" class="btn btn-sm btn-outline-dark w-100 rounded-pill btn-centered">Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
