<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FoundIt - Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="d-flex align-items-center" style="min-height: 100vh; background-color: #F9FAFB;">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-primary">FoundIt</h2>
                    <p class="text-muted">Create an account to report items.</p>
                </div>
                
                <div class="card p-4 p-sm-5">
                    <div th:if="${error}" class="alert alert-danger border-0 rounded-3 text-sm" th:text="${error}"></div>
                    <form action="/register" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-muted">Full Name</label>
                            <input type="text" name="fullName" class="form-control form-control-lg rounded-3 bg-light border-0" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-muted">Email Address</label>
                            <input type="email" name="email" class="form-control form-control-lg rounded-3 bg-light border-0" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-muted">Username</label>
                            <input type="text" name="username" class="form-control form-control-lg rounded-3 bg-light border-0" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold small text-muted">Password</label>
                            <input type="password" name="password" class="form-control form-control-lg rounded-3 bg-light border-0" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 btn-lg rounded-pill fw-bold mb-3">Create Account</button>
                    </form>
                    <p class="text-center text-muted small mt-3 mb-0">
                        Already have an account? <a href="/login" class="fw-semibold text-primary text-decoration-none">Sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
