<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — Foundite</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link th:href="@{/css/index.css}" rel="stylesheet" />
    <link th:href="@{/css/auth.css}" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-md navbar-foundite px-4">
      <a class="navbar-brand" th:href="@{/}">FOUNDITE</a>
      <button
        class="navbar-toggler ms-auto"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navMenu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navMenu">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/items}">Find</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/items/new}">Add</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" th:href="@{/register}">Register</a>
          </li>
        </ul>
      </div>
    </nav>

    <main class="auth-main">
      <div class="auth-card">
        <h1 class="auth-title">CREATE ACCOUNT</h1>
        <p class="auth-subtitle">Join the Foundite community</p>

        <div
          th:if="${error}"
          th:text="${error}"
          class="auth-alert auth-alert-error"
        ></div>

        <form th:action="@{/register}" method="post" class="auth-form">
          <div class="auth-row-2">
            <div class="auth-group">
              <label for="username" class="auth-label"
                >Username <span class="required">*</span></label
              >
              <input
                type="text"
                id="username"
                name="username"
                class="auth-input"
                placeholder="min. 3 characters"
                required
                minlength="3"
                maxlength="50"
              />
            </div>
            <div class="auth-group">
              <label for="fullName" class="auth-label"
                >Full Name <span class="required">*</span></label
              >
              <input
                type="text"
                id="fullName"
                name="fullName"
                class="auth-input"
                placeholder="John Doe"
                required
              />
            </div>
          </div>
          <div class="auth-group">
            <label for="email" class="auth-label"
              >Email <span class="required">*</span></label
            >
            <input
              type="email"
              id="email"
              name="email"
              class="auth-input"
              placeholder="you@example.com"
              required
            />
          </div>
          <div class="auth-group">
            <label for="password" class="auth-label"
              >Password <span class="required">*</span></label
            >
            <input
              type="password"
              id="password"
              name="password"
              class="auth-input"
              placeholder="min. 6 characters"
              required
              minlength="6"
            />
          </div>
          <button type="submit" class="auth-btn">CREATE ACCOUNT</button>
        </form>

        <p class="auth-switch">
          Already have an account? <a th:href="@{/login}">Log in</a>
        </p>
      </div>
    </main>

    <footer class="py-4 text-center">
      <p class="mb-0">&copy; 2026 Foundite</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
