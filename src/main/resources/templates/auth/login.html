<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Foundite</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link th:href="@{/css/index.css}" rel="stylesheet" />
    <link th:href="@{/css/auth.css}" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-md navbar-foundite px-4">
      <a class="navbar-brand" th:href="@{/}">FOUNDITE</a>
      <button
        class="navbar-toggler ms-auto"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navMenu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navMenu">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/items}">Find</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/items/new}">Add</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" th:href="@{/login}">Login</a>
          </li>
        </ul>
      </div>
    </nav>

    <main class="auth-main">
      <div class="auth-card">
        <h1 class="auth-title">WELCOME BACK</h1>
        <p class="auth-subtitle">Log in to your Foundite account</p>

        <div th:if="${param.error}" class="auth-alert auth-alert-error">
          Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="auth-alert auth-alert-success">
          You have been logged out.
        </div>
        <div th:if="${param.registered}" class="auth-alert auth-alert-success">
          Registration successful! Please log in.
        </div>

        <form th:action="@{/login}" method="post" class="auth-form">
          <div class="auth-group">
            <label for="username" class="auth-label">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              class="auth-input"
              placeholder="your username"
              required
            />
          </div>
          <div class="auth-group">
            <label for="password" class="auth-label">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              class="auth-input"
              placeholder="••••••••"
              required
            />
          </div>
          <button type="submit" class="auth-btn">LOG IN</button>
        </form>

        <p class="auth-switch">
          No account? <a th:href="@{/register}">Register here</a>
        </p>
      </div>
    </main>

    <footer class="py-4 text-center">
      <p class="mb-0">&copy; 2026 Foundite</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
