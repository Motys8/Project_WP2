<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FoundIt - Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="d-flex align-items-center" style="min-height: 100vh; background-color: #F9FAFB;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-primary">FoundIt</h2>
                    <p class="text-muted">Welcome back! Please enter your details.</p>
                </div>
                
                <div class="card p-4 p-sm-5">
                    <div th:if="${param.registered}" class="alert alert-success border-0 rounded-3 text-center text-sm">
                        Registration successful! Please sign in.
                    </div>
                    <form action="/login" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-muted">Username</label>
                            <input type="text" name="username" class="form-control form-control-lg rounded-3 bg-light border-0" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold small text-muted">Password</label>
                            <input type="password" name="password" class="form-control form-control-lg rounded-3 bg-light border-0" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-lg rounded-pill fw-bold mb-3">Sign In</button>
                    </form>
                    <p class="text-center text-muted small mt-3 mb-0">
                        Don't have an account? <a href="/register" class="fw-semibold text-primary text-decoration-none">Sign up</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
