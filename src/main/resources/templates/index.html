<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foundite</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link th:href="@{/css/index.css}" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-md navbar-foundite px-4">
      <a class="navbar-brand" th:href="@{/}">FOUNDITE</a>
      <button
        class="navbar-toggler ms-auto"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navMenu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navMenu">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/items}">Find</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/items/new}">Add</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/profile}">Profile</a>
          </li>
        </ul>
      </div>
    </nav>

    <section class="hero">
      <img class="hero-bg" th:src="@{/images/1.png}" alt="" />
      <div class="container">
        <div class="hero-box">
          <h1>FOUND SOMETHING?<br />SEARCH SOMETHING?<br />LET US KNOW</h1>
          <div class="hero-actions mt-4">
            <a th:href="@{/items/new}" class="btn btn-light px-4 py-2"
              >POST ITEM</a
            >
            <a th:href="@{/items}" class="btn btn-outline-light px-4 py-2"
              >BROWSE LISTINGS</a
            >
          </div>
        </div>
      </div>
    </section>

    <footer class="py-4 text-center">
      <p class="mb-0">&copy; 2026 Foundite</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
